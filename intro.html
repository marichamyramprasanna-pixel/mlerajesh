.grid{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(rgba(70,120,190,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(70,120,190,.35) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent)}
.panel{
 position:relative;overflow:hidden;width:min(900px,88vw);text-align:center;padding:54px 40px 48px;
 border:1px solid rgba(255,255,255,.65);border-radius:34px;
 background:linear-gradient(145deg,rgba(255,255,255,.48),rgba(255,255,255,.18));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.92),inset 0 -1px 0 rgba(100,130,170,.10),0 28px 70px rgba(40,65,100,.20);
 backdrop-filter:blur(32px) saturate(165%);-webkit-backdrop-filter:blur(32px) saturate(165%)
}
.panel:before{content:"";position:absolute;left:-8%;right:-8%;top:-50%;height:72%;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,0));transform:rotate(-4deg);pointer-events:none}
.panel:after{content:"";position:absolute;width:220px;height:220px;right:-70px;bottom:-120px;border-radius:50%;background:rgba(120,170,255,.20);filter:blur(28px);pointer-events:none}
.badge{position:relative;z-index:1;display:inline-block;padding:8px 16px;border:1px solid rgba(255,255,255,.66);border-radius:999px;color:#3f679d;letter-spacing:.16em;font-size:11px;text-transform:uppercase;background:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 7px 14px rgba(50,80,120,.08)}
.title{position:relative;z-index:1;font-size:clamp(32px,5vw,58px);font-weight:800;letter-spacing:-1.5px;margin:20px 0 0;line-height:1.06}
.sub{position:relative;z-index:1;font-size:18px;color:#526277;margin:12px 0 38px}
.line{position:relative;z-index:1;height:1px;width:72%;margin:0 auto 34px;background:linear-gradient(90deg,transparent,rgba(90,135,205,.50),transparent)}
.steps{position:relative;z-index:1;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.step{
 min-width:150px;padding:14px 16px;border:1px solid rgba(255,255,255,.58);border-radius:20px;
 background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(255,255,255,.16));color:#33445a;font-size:13px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.86),0 10px 20px rgba(40,65,95,.10);
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)
}
.step b{display:block;color:#4d80c8;margin-bottom:5px;font-size:11px;letter-spacing:1px}
.status{position:relative;z-index:1;margin-top:38px;color:#64748a;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ac59a;margin-right:8px;box-shadow:0 0 12px rgba(74,197,154,.8)}
.bar{position:relative;z-index:1;width:300px;max-width:70%;height:5px;background:rgba(90,120,160,.15);border-radius:99px;margin:13px auto 0;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#76a9ff,#5c8fe5);border-radius:99px;animation:load .7s linear forwards}
@keyframes load{to{width:100%}}
@media(max-width:600px){.panel{padding:38px 20px}.steps{gap:9px}.step{min-width:135px}.sub{font-size:15px}}

</style>
</head>

<div class="grid"></div>
<main class="panel">
  <div class="badge">Industrial Condition Monitoring</div>
  <h1 class="title">Machine Fault Diagnosis</h1>
  <p class="sub">Multi-Sensor Data &amp; Ensemble Learning</p>
  <div class="line"></div>
  <div class="steps">
    <div class="step"><b>01</b>Sensor Acquisition</div>
    <div class="step"><b>02</b>Data Processing</div>
    <div class="step"><b>03</b>Fault Classification</div>
    <div class="step"><b>04</b>Diagnosis &amp; Monitoring</div>
  </div>
  <div class="status"><span class="dot"></span>Initializing monitoring system...</div>
  <div class="bar"><div class="fill"></div></div>
</main>
